<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Tasks エクスポート</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      width: 320px;
      padding: 20px;
      background: #f8f9fa;
      color: #202124;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a73e8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1::before {
      content: "✓";
      background: #1a73e8;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .options {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }

    .option-label {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      accent-color: #1a73e8;
      width: 14px;
      height: 14px;
    }

    #exportBtn {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #exportBtn:hover:not(:disabled) {
      background: #1557b0;
    }

    #exportBtn:disabled {
      background: #a8c7fa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }

    .status-loading {
      color: #1a73e8;
    }

    .status-success {
      color: #0f9d58;
      font-weight: 500;
    }

    .status-error {
      color: #d93025;
    }

    .progress {
      margin-top: 8px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: #1a73e8;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>Google Tasks エクスポート</h1>

  <div class="options">
    <div class="option-label">オプション</div>
    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" id="includeCompleted" checked>
        完了済みタスクを含める
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="includeNotes" checked>
        メモを含める
      </label>
    </div>
  </div>

  <button id="exportBtn">CSV をダウンロード</button>

  <div class="progress" id="progressBar">
    <div class="progress-bar" id="progressFill"></div>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
